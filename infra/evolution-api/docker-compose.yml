# Local/dev Evolution API instance for the whatsapp_status beta channel.
# After `docker compose up -d`, set OPENSQUAD_EVOLUTION_ADMIN_URL and
# OPENSQUAD_EVOLUTION_ADMIN_APIKEY (= this .env's AUTHENTICATION_API_KEY) on
# the content-central-server process — each project then connects its own
# instance with one click ("Conectar WhatsApp" in Conta e token), no manual
# instance creation or pasted credentials needed.
services:
  evolution-api:
    # atendai/evolution-api was the old image name (last published v1.7.1,
    # abandoned) — the project moved to evoapicloud/evolution-api.
    image: evoapicloud/evolution-api:latest
    restart: always
    ports:
      - "8080:8080"
    env_file:
      - .env
    volumes:
      - evolution_instances:/evolution/instances
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  postgres:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: evolution
      POSTGRES_PASSWORD: evolution
      POSTGRES_DB: evolution
    volumes:
      - evolution_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evolution"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    restart: always
    volumes:
      - evolution_redis:/data

volumes:
  evolution_instances:
  evolution_postgres:
  evolution_redis:
